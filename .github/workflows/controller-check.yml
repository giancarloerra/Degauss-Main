name: controller-check

on:
  pull_request:
  push:
    branches: [degauss]

permissions:
  contents: read

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/run-degauss-controls-tests.py
      - run: bash tests/run-degauss-shortcut-tests.sh
      - run: python3 tests/degauss_script_handover_test.py
      - run: python3 tests/degauss_native_scripts_test.py
      - run: python3 tests/run-degauss-core-menu-tests.py

  arm-input-check:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install the MiSTer target compiler
        run: |
          printf 'deb http://deb.debian.org/debian bullseye main\n' > /etc/apt/sources.list.d/bullseye.list
          printf 'Package: *\nPin: release n=bullseye\nPin-Priority: 1\n\nPackage: *-armhf-cross\nPin: release n=bullseye\nPin-Priority: 990\n' > /etc/apt/preferences.d/mister-target
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates gcc-10-arm-linux-gnueabihf g++-10-arm-linux-gnueabihf
      - uses: actions/checkout@v5
      - name: Check the actual ARM input and menu translation units
        run: |
          arm-linux-gnueabihf-g++-10 -std=gnu++14 -mcpu=cortex-a9 -mfpu=neon -mfloat-abi=hard \
            -I. -Ilib/libco -Ilib/miniz -Ilib/md5 -Ilib/lzma -Ilib/zstd/lib \
            -Ilib/libchdr/include -Ilib/bluetooth -Ilib/serial_server/library \
            -D_7ZIP_ST '-DPACKAGE_VERSION="1.3.3"' -DHAVE_LROUND -DHAVE_STDINT_H \
            -DHAVE_STDLIB_H -DHAVE_SYS_PARAM_H -DENABLE_64_BIT_WORDS=0 \
            -D_FILE_OFFSET_BITS=64 -D_LARGEFILE64_SOURCE '-DVDATE="check"' \
            -Wall -Wextra -Werror -Wno-psabi -fsyntax-only input.cpp menu.cpp
